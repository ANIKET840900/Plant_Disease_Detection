{
  "seed": 42,
  "data_dir": "data/processed/PlantVillage",
  "split_manifest": "reports/generated/split_manifest.json",
  "model_dir": "saved_models/candidate",
  "report_dir": "reports/generated",
  "architecture": "mobilenet_v3_small",
  "head_dropout": 0.3,
  "image_size": 224,
  "batch_size": 16,
  "epochs": 15,
  "head_warmup_epochs": 3,
  "patience": 5,
  "minimum_validation_loss_delta": 0.001,
  "learning_rate": 0.001,
  "backbone_learning_rate": 0.00001,
  "head_fine_tune_learning_rate": 0.0001,
  "cosine_warmup_epochs": 1,
  "label_smoothing": 0.1,
  "weight_decay": 0.0001,
  "num_workers": 0,
  "deterministic": true,
  "augmentation": {
    "crop_scale": [0.78, 1.0],
    "crop_ratio": [0.85, 1.15],
    "horizontal_flip_probability": 0.5,
    "vertical_flip_probability": 0.1,
    "color_jitter_probability": 0.8,
    "brightness": 0.22,
    "contrast": 0.22,
    "saturation": 0.2,
    "hue": 0.04,
    "rotation_degrees": 30,
    "translation_fraction": 0.08,
    "scale_range": [0.88, 1.12],
    "shear_degrees": 8,
    "perspective_probability": 0.15,
    "perspective_distortion": 0.12,
    "motion_blur_probability": 0.08,
    "gaussian_blur_probability": 0.12,
    "gaussian_blur_sigma": [0.1, 1.5],
    "shadow_probability": 0.15,
    "random_erasing_probability": 0.15,
    "random_erasing_scale": [0.02, 0.12],
    "random_erasing_ratio": [0.3, 3.3]
  },
  "split_fractions": {
    "train": 0.7,
    "validation": 0.1,
    "calibration": 0.1,
    "test": 0.1
  }
}
